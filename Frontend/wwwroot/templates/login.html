<div class="container">
    <div class="row justify-content-center" style="margin-top: 100px;">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h2>Gizli Müşteri Sistemi</h2>
                        <p class="text-muted">Giriş yapın</p>
                    </div>

                    <!-- Error Message -->
                    <div data-bind="visible: errorMessage" class="alert alert-danger" role="alert">
                        <span data-bind="text: errorMessage"></span>
                    </div>

                    <form data-bind="submit: login">
                        <div class="mb-3">
                            <label class="form-label">Kullanıcı Adı</label>
                            <input type="text" class="form-control" data-bind="value: username, disable: isLoading" placeholder="admin" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Şifre</label>
                            <input type="password" class="form-control" data-bind="value: password, disable: isLoading" placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100" data-bind="disable: isLoading">
                            <span data-bind="visible: !isLoading()">Giriş Yap</span>
                            <span data-bind="visible: isLoading">
                                <span class="spinner-border spinner-border-sm me-2"></span>
                                Giriş yapılıyor...
                            </span>
                        </button>
                    </form>

                    <div class="mt-4 text-center">
                        <small class="text-muted">
                            Test Hesabı: <strong>admin</strong> / <strong>Admin@123</strong>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
