<div class="container-fluid">
    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#/dashboard">
                <i class="bi bi-clipboard-check me-2"></i>
                Gizli Müşteri Sistemi
            </a>
            <div class="d-flex align-items-center">
                <span class="me-3" data-bind="text: 'Hoş geldin, ' + user().fullName"></span>
                <button class="btn btn-outline-danger btn-sm" data-bind="click: logout">
                    <i class="bi bi-box-arrow-right me-1"></i>
                    Çıkış
                </button>
            </div>
        </div>
    </nav>

    <!-- Navigation Menu -->
    <div class="mb-4" data-bind="visible: isAdmin">
        <ul class="nav nav-pills">
            <li class="nav-item">
                <a class="nav-link active" href="#/dashboard">
                    <i class="bi bi-speedometer2 me-1"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#/checklists">
                    <i class="bi bi-list-check me-1"></i> Kontrol Listeleri
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#/projects">
                    <i class="bi bi-folder me-1"></i> Projeler
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#/assignments">
                    <i class="bi bi-person-check me-1"></i> Atamalar
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#/evaluations">
                    <i class="bi bi-star me-1"></i> Değerlendirmeler
                </a>
            </li>
        </ul>
    </div>

    <!-- Loading -->
    <div data-bind="visible: isLoading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Yükleniyor...</span>
        </div>
    </div>

    <!-- Error Message -->
    <div data-bind="visible: errorMessage" class="alert alert-danger" role="alert">
        <span data-bind="text: errorMessage"></span>
    </div>

    <!-- Dashboard Content (Admin View) -->
    <div data-bind="visible: !isLoading() && isAdmin()">
        <h2 class="mb-4">Dashboard</h2>

        <!-- Stats Cards -->
        <div class="row mb-4">
            <div class="col-md-4 mb-3">
                <div class="card bg-primary text-white shadow">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-white-50">Toplam Değerlendirme</h6>
                                <h3 data-bind="text: totalEvaluations"></h3>
                            </div>
                            <i class="bi bi-clipboard-check fs-1"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card bg-success text-white shadow">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-white-50">Ortalama Puan</h6>
                                <h3 data-bind="text: formattedAverageScore"></h3>
                            </div>
                            <i class="bi bi-star-fill fs-1"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card bg-info text-white shadow">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-white-50">Değişim</h6>
                                <h3>
                                    <span data-bind="text: percentageChange().toFixed(1)"></span>%
                                    <i data-bind="css: percentageChangeIcon"></i>
                                </h3>
                            </div>
                            <i class="bi bi-graph-up fs-1"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Top/Bottom Branches -->
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card shadow">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">En İyi 5 Şube</h5>
                    </div>
                    <div class="card-body">
                        <div data-bind="visible: topBranches().length === 0" class="text-center text-muted">
                            Henüz veri bulunmamaktadır.
                        </div>
                        <ul class="list-group list-group-flush" data-bind="foreach: topBranches">
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <span data-bind="text: branchName"></span>
                                <span class="badge bg-success rounded-pill" data-bind="text: averageScore.toFixed(1)"></span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card shadow">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Geliştirilmesi Gereken 5 Şube</h5>
                    </div>
                    <div class="card-body">
                        <div data-bind="visible: bottomBranches().length === 0" class="text-center text-muted">
                            Henüz veri bulunmamaktadır.
                        </div>
                        <ul class="list-group list-group-flush" data-bind="foreach: bottomBranches">
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <span data-bind="text: branchName"></span>
                                <span class="badge bg-warning rounded-pill" data-bind="text: averageScore.toFixed(1)"></span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
